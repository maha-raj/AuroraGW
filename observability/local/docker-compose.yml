services:
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: auroragw-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=0.0.0.0:9090"
    volumes:
      - /etc/auroragw/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/lib/auroragw/observability/prometheus:/prometheus
    ports:
      - "9095:9090"

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: auroragw-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - /var/lib/auroragw/observability/grafana:/var/lib/grafana
      - /opt/auroragw/observability/local/grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
