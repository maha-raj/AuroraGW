global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: auroragw
    scheme: https
    metrics_path: /metrics
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets:
          # Replace with your AuroraGW LAN IP + port (8443)
          - 192.168.101.1:8443
