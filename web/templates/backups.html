{% extends "base.html" %}

{% block title %}Backups · AuroraGW{% endblock %}

{% block content %}
  <div class="card">
    <h1 class="h1">Backups</h1>
    <p class="muted">Create and list backup archives.</p>
    <form method="post" action="/backup">
      <button class="primary" type="submit">Create backup now</button>
    </form>
  </div>

  <div class="card">
    <h2 class="h2">Existing backups</h2>
    <pre>{{ backups }}</pre>
    <p class="muted">Stored in <code>/var/lib/auroragw/backups/</code>.</p>
  </div>
{% endblock %}
