{% extends "base.html" %}

{% block title %}Dashboard · AuroraGW{% endblock %}

{% block content %}
  <div class="card">
    <h1 class="h1">Dashboard</h1>
    <p class="muted">Home gateway management for LAN/OPT1 (LAN-only by default).</p>
  </div>

  <div class="grid cols-2">
    <div class="card">
      <h2 class="h2">Quick actions</h2>
      <div class="row">
        <a class="btn primary" href="/status">Status + Apply</a>
        <a class="btn" href="/config">Config editor</a>
        <a class="btn" href="/dns">DNS settings</a>
      </div>
    </div>
    <div class="card">
      <h2 class="h2">Troubleshooting</h2>
      <div class="row">
        <a class="btn" href="/traffic">Traffic</a>
        <a class="btn" href="/logs">Logs</a>
        <a class="btn" href="/suricata">Suricata</a>
        <a class="btn" href="/evebox">EveBox</a>
      </div>
    </div>
  </div>
{% endblock %}
