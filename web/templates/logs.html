{% extends "base.html" %}

{% block title %}Logs · AuroraGW{% endblock %}

{% block content %}
  <div class="card">
    <h1 class="h1">Logs</h1>
    <p class="muted">Audit + recent systemd journal entries.</p>
  </div>

  <div class="grid cols-2">
    <div class="card">
      <h2 class="h2">AuroraGW audit log</h2>
      <pre>{{ audit }}</pre>
    </div>
    <div class="card">
      <h2 class="h2">Web UI errors</h2>
      <pre>{{ web_errors }}</pre>
    </div>
    <div class="card">
      <h2 class="h2">systemd journal (last 200)</h2>
      <pre>{{ journal }}</pre>
    </div>
  </div>
{% endblock %}
